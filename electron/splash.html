<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShotAi Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0f1e 0%, #1e1136 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            -webkit-app-region: drag; /* Makes the splash draggable */
            border: 1px solid #3b2a5c;
            box-sizing: border-box;
            border-radius: 12px;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin: 0 0 32px 0;
        }
        .loader-bar {
            width: 200px;
            height: 4px;
            background-color: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            border-radius: 2px;
            animation: slide 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        @keyframes slide {
            0% { left: -30%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="logo-box">SA</div>
    <div class="title">ShotAi</div>
    <div class="subtitle">Memuat Tools Manager...</div>
    <div class="loader-bar">
        <div class="loader-fill"></div>
    </div>
</body>
</html>
